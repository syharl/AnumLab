<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnumLab</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    button {
      background: #34c759;
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
    }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h1>AnumLab</h1>
  <p>Tahap 1: Tes fondasi FFmpeg</p>
  <button id="testBtn">Test Gabung Video</button>
  <div id="status">Belum ada tes dijalankan.</div>

  <script>
    document.getElementById('testBtn').addEventListener('click', async () => {
      const statusEl = document.getElementById('status');
      try {
        const { Ffmpeg } = window.Capacitor.Plugins;

        statusEl.innerText = 'Menyalin file contoh...';
        const foto = await Ffmpeg.copyAssetToCache({ fileName: 'assets/test-foto.jpg' });
        const video = await Ffmpeg.copyAssetToCache({ fileName: 'assets/test-video.mp4' });
        const cacheDir = await Ffmpeg.getCacheDir();
        const outputPath = cacheDir.path + '/hasil-test.mp4';

        statusEl.innerText = 'Menjalankan FFmpeg (gabung foto + video)...';

        // Foto jadi background, video ditaruh sebagai overlay kecil
        // di pojok kanan bawah, mengikuti durasi video
        const command =
          `-y -loop 1 -i "${foto.path}" -i "${video.path}" ` +
          `-filter_complex "[1:v]scale=iw*0.5:-1[ov];[0:v][ov]overlay=W-w-20:H-h-20:shortest=1" ` +
          `-c:v mpeg4 -pix_fmt yuv420p "${outputPath}"`;

        const hasil = await Ffmpeg.run({ command });

        if (hasil.success) {
          statusEl.innerText = 'Berhasil! Hasil tersimpan di: ' + outputPath;
        } else {
          statusEl.innerText = 'FFmpeg gagal, cek log.';
        }
      } catch (e) {
        statusEl.innerText = 'Error: ' + (e.message || JSON.stringify(e));
      }
    });
  </script>
  <script src="update-check.js"></script>
</body>
</html>
