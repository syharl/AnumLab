<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnumLab</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    button {
      background: #34c759;
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
    }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h1>AnumLab</h1>
  <p>Tahap 1: Tes fondasi FFmpeg</p>
  <button id="testBtn">Test Gabung Video</button>
  <div id="status">Belum ada tes dijalankan.</div>

  <script>
    // CATATAN: Ini baru kerangka UI.
    // Fungsi testFfmpeg() di bawah akan diisi setelah
    // native bridge (Capacitor Plugin Java) untuk FFmpeg dibuat.
    document.getElementById('testBtn').addEventListener('click', async () => {
      const statusEl = document.getElementById('status');
      statusEl.innerText = 'Menjalankan tes... (bridge FFmpeg belum terpasang)';

      // Placeholder - akan diganti dengan panggilan plugin FFmpeg asli
      // Contoh nanti kira-kira:
      // const result = await AnumFfmpeg.run({ command: '-i foto.jpg -i video.mp4 ...' });

      statusEl.innerText = 'UI siap. Lanjut pasang native bridge FFmpeg di langkah berikutnya.';
    });
  </script>
  <script src="update-check.js"></script>
</body>
</html>
