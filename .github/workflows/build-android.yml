name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Cek cepat apakah password keystore & key cocok (sebelum build lama dimulai)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Waktu commit terakhir file keystore:"
          git log -1 --format="%ai" -- signing/anumlab-keystore.jks

          echo "--- Tes 1: buka keystore pakai ANDROID_KEYSTORE_PASSWORD ---"
          keytool -list \
            -keystore signing/anumlab-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

          echo "--- Tes 2: buka KEY di dalamnya pakai ANDROID_KEY_PASSWORD ---"
          cp signing/anumlab-keystore.jks /tmp/tes-keystore.jks
          keytool -keypasswd \
            -alias anumlab \
            -keystore /tmp/tes-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -new "$ANDROID_KEY_PASSWORD"
          echo "Tes 2 LOLOS - ANDROID_KEY_PASSWORD benar"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies npm
        run: npm install

      - name: Generate project Android (folder android/ dibuat ulang tiap build)
        run: npx cap add android

      - name: Sinkronkan plugin ke Android
        run: npx cap sync android

      - name: Pasang native plugin FFmpeg (FfmpegPlugin.java) & daftarkan di MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/syharl/anumlab
          cp native-android/FfmpegPlugin.java android/app/src/main/java/com/syharl/anumlab/FfmpegPlugin.java
          cat > android/app/src/main/java/com/syharl/anumlab/MainActivity.java << 'EOF'
          package com.syharl.anumlab;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(FfmpegPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat android/app/src/main/java/com/syharl/anumlab/MainActivity.java

      - name: Naikkan minSdkVersion ke 24 (dibutuhkan library FFmpeg)
        run: |
          sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 24/" android/variables.gradle
          cat android/variables.gradle

      - name: Naikkan compileSdk/targetSdk ke 35 + AGP & Gradle yang kompatibel
        run: |
          sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 35/" android/variables.gradle
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 35/" android/variables.gradle
          sed -i -E "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.7.2/" android/build.gradle
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat android/variables.gradle
          cat android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Tambahkan dependency FFmpeg ke build.gradle
        run: |
          echo "" >> android/app/build.gradle
          echo "dependencies {" >> android/app/build.gradle
          echo "    implementation 'com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Siapkan keystore & tambahkan signing config
        run: |
          cp signing/anumlab-keystore.jks android/app/anumlab-keystore.jks
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("anumlab-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")?.trim()
                      keyAlias "anumlab"
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")?.trim()
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build APK Release (sudah ditandatangani)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: anumlab-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Hitung nomor versi (format tahunKe.bulan.tanggal.jamMenit)
        id: versi
        run: |
          # TAHUN_MULAI = tahun pertama project ini dimulai.
          # Ganti angka ini cuma sekali kalau ternyata salah,
          # jangan diubah-ubah lagi setelahnya.
          TAHUN_MULAI=2026
          TAHUN_KE=$(( $(TZ='Asia/Jakarta' date +%Y) - TAHUN_MULAI + 1 ))
          BULAN=$(TZ='Asia/Jakarta' date +%-m)
          TANGGAL=$(TZ='Asia/Jakarta' date +%-d)
          JAM_MENIT=$(TZ='Asia/Jakarta' date +%H%M)
          VERSI="${TAHUN_KE}.${BULAN}.${TANGGAL}.${JAM_MENIT}"
          echo "versi=$VERSI" >> "$GITHUB_OUTPUT"
          echo "Nomor versi build ini: $VERSI"

      - name: Bungkus folder www jadi web-bundle.zip (untuk hot update)
        run: |
          cd www
          zip -r ../web-bundle.zip .
          cd ..

      - name: Rename APK sesuai nomor versi
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk anumlab-${{ steps.versi.outputs.versi }}.apk

      - name: Buat GitHub Release otomatis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.versi.outputs.versi }}" \
            anumlab-${{ steps.versi.outputs.versi }}.apk \
            web-bundle.zip \
            --title "AnumLab ${{ steps.versi.outputs.versi }}" \
            --notes "Build otomatis dari commit ${{ github.sha }}"

      - name: Hapus release lama, simpan maksimal 3 terbaru
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              echo "Menghapus release lama: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done

# CATATAN PENTING:
# 1. Workflow ini sekarang build versi RELEASE (signed pakai keystore tetap
#    di folder signing/anumlab-keystore.jks, yang dibuat sekali lewat
#    generate-keystore.yml dan otomatis ter-commit ke repo). Cuma butuh
#    2 secret (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD) + 1 alias
#    tetap "anumlab" - WAJIB jalankan generate-keystore.yml dulu (sekali
#    saja) sebelum workflow ini bisa berhasil build.
# 2. Dependency FFmpeg pakai fork komunitas "ffmpeg-kit-16kb" karena
#    FFmpegKit versi asli (arthenica) sudah dihentikan & dihapus dari
#    Maven Central sejak awal 2025. Fork ini pakai nama package Java
#    yang sama (com.arthenica.ffmpegkit) jadi kode pemanggilannya tidak
#    berubah - tapi tetap perlu dites langsung karena bukan dari
#    penulis aslinya.
# 3. Format versi: tahunKe.bulan.tanggal.jamMenit (WIB), contoh 1.9.6.2030.
#    "tahunKe" dihitung dari TAHUN_MULAI=2026 (tahun 1). Kalau tahun
#    project berjalan lewat 2027, otomatis jadi tahunKe=2, dst - tidak
#    perlu diubah manual.
# 4. Tiap build otomatis bikin 1 GitHub Release baru berisi APK +
#    web-bundle.zip, dan release yang lebih lama dari 3 terbaru otomatis
#    dihapus botnya sendiri (lewat gh release delete).
# 5. Aplikasi (lewat www/update-check.js) baca release TERBARU ini untuk
#    cek update: kalau cuma web-bundle.zip yang beda -> hot update
#    otomatis tanpa install ulang. Kalau butuh native baru, tandai di
#    kotak "Notes" saat edit release manual dengan baris: MIN_NATIVE: 2
#    (angka lebih besar dari NATIVE_BUILD di update-check.js) supaya
#    aplikasi lama menampilkan popup minta update APK penuh.
