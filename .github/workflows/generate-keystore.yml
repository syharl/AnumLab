name: Generate Keystore (jalankan SEKALI saja)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java (untuk tool keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Buat keystore + password acak
        run: |
          STORE_PASS=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 20)
          KEY_PASS=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 20)
          ALIAS="anumlab"

          keytool -genkeypair -v \
            -keystore anumlab-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=AnumLab, OU=Dev, O=Syharl, L=Unknown, S=Unknown, C=ID"

          base64 -w 0 anumlab-keystore.jks > keystore_base64.txt

          {
            echo "=== SIMPAN INI BAIK-BAIK, JANGAN HILANG ==="
            echo ""
            echo "ANDROID_KEY_ALIAS = $ALIAS"
            echo "ANDROID_KEYSTORE_PASSWORD = $STORE_PASS"
            echo "ANDROID_KEY_PASSWORD = $KEY_PASS"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64 (isi file keystore_base64.txt di artifact ini):"
            echo "lihat file terpisah keystore_base64.txt, isinya panjang jadi tidak dicetak di sini"
          } > INFO_PENTING.txt

          cat INFO_PENTING.txt

      - name: Upload hasil sebagai artifact (unduh, lalu HAPUS artifact ini setelah disimpan)
        uses: actions/upload-artifact@v4
        with:
          name: anumlab-keystore-RAHASIA
          path: |
            INFO_PENTING.txt
            keystore_base64.txt
            anumlab-keystore.jks
          retention-days: 1
