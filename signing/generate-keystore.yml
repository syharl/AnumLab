name: Generate Keystore (jalankan SEKALI saja)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (untuk tool keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Buat keystore + password acak
        run: |
          STORE_PASS=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 20)
          KEY_PASS=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9' | head -c 20)
          ALIAS="anumlab"

          mkdir -p signing
          rm -f signing/anumlab-keystore.jks
          keytool -genkeypair -v \
            -keystore signing/anumlab-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=AnumLab, OU=Dev, O=Syharl, L=Unknown, S=Unknown, C=ID"

          {
            echo "=== SIMPAN INI BAIK-BAIK, JANGAN HILANG ==="
            echo ""
            echo "ANDROID_KEY_ALIAS = $ALIAS"
            echo "ANDROID_KEYSTORE_PASSWORD = $STORE_PASS"
            echo "ANDROID_KEY_PASSWORD = $KEY_PASS"
          } > INFO_PENTING.txt

          cat INFO_PENTING.txt

      - name: Commit file keystore langsung ke repo (folder signing/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signing/anumlab-keystore.jks
          git commit -m "Tambah keystore signing AnumLab (dibuat otomatis, sekali saja)"
          git push

      - name: Upload info password sebagai artifact (unduh, lalu hapus artifact ini)
        uses: actions/upload-artifact@v4
        with:
          name: anumlab-password-RAHASIA
          path: INFO_PENTING.txt
          retention-days: 1

